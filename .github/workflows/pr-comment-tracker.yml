name: PR Comment Tracker

on:
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited]
  # Review-thread resolution has no supported Actions event; refresh periodically.
  schedule:
    - cron: '17,47 * * * *'

jobs:
  discover-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.discover.outputs.prs }}
    steps:
      - id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // TRACKER_OPEN_PRS: scheduled runs only write to same-repository human PRs.
            const { owner, repo } = context.repo;
            let prs = context.payload.pull_request
              ? [context.payload.pull_request]
              : (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }))
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}` && pr.user.login !== 'dependabot[bot]');
            if (!context.payload.pull_request && prs.length > 256) {
              // Rotate through a stable ordering every scheduled half-hour so the
              // matrix limit does not permanently exclude the same PRs.
              prs.sort((a, b) => a.number - b.number);
              const start = (Math.floor(Date.now() / (30 * 60 * 1000)) * 256) % prs.length;
              const deferred = prs.length - 256;
              prs = Array.from({ length: 256 }, (_, i) => prs[(start + i) % prs.length]);
              core.notice(`Refreshing 256 PRs; ${deferred} deferred to later scheduled runs.`);
            }
            core.setOutput('prs', JSON.stringify(prs.map(pr => ({ number: pr.number, headSha: pr.head.sha, mergeSha: pr.merge_commit_sha }))));

  update-summary-and-check:
    name: Aggregate Comments & Enforce Resolution
    needs: discover-prs
    if: needs.discover-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover-prs.outputs.prs) }}
    concurrency:
      group: pr-comment-tracker-${{ matrix.pr.number }}
      cancel-in-progress: false

    # Berechtigungen zum Lesen und Schreiben in PRs
    permissions:
      pull-requests: write
      issues: write
      checks: write

    steps:
      - name: Track, Summarize and Validate Comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          # Fork-PRs und Dependabot-Läufe erhalten ein schreibgeschütztes Token
          # (gleiches Muster wie dead-code-report.yml, dazu der Dependabot-Actor).
          SAME_REPO_PR: ${{ github.event_name == 'schedule' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          PR_NUMBER: ${{ matrix.pr.number }}
          PR_HEAD_SHA: ${{ matrix.pr.headSha }}
          PR_MERGE_SHA: ${{ matrix.pr.mergeSha }}
          PERIODIC_REFRESH: ${{ github.event_name == 'schedule' }}
        with:
          script: |
            // 1. PR-Nummer aus dem Trigger-Event ermitteln
            const prNumber = context.payload.pull_request?.number ?? Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;

            // Unsichtbarer Marker, um den Kommentar des Bots später wiederzufinden
            const marker = "<!-- PR_COMMENT_TRACKER_MARKER -->";

            // 2. Den bestehenden Kommentar abrufen, um bereits gemeldete Threads zu identifizieren
            const issueComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber });
            const existingBotComment = issueComments.find(
              c => c.body && c.body.startsWith(marker) && c.user && c.user.login === "github-actions[bot]"
            );

            // Bereits gemeldete Thread-IDs aus dem bestehenden Kommentar extrahieren
            let reportedThreadIds = new Set();
            if (existingBotComment) {
              const match = existingBotComment.body.match(/<!-- REPORTED_THREADS: (.*?) -->/);
              if (match && match[1]) {
                reportedThreadIds = new Set(match[1].split(',').filter(Boolean));
              }
            }

            // 3. Ungelöste Review-Threads via GraphQL ermitteln
            let hasNextPage = true;
            let cursor = null;
            const unresolvedThreads = [];

            while (hasNextPage) {
              const query = `
                query($owner: String!, $repo: String!, $prNumber: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $prNumber) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          isResolved
                          comments(first: 1) {
                            nodes {
                              author {
                                login
                                __typename
                              }
                              body
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, prNumber, cursor });
              const threads = result.repository.pullRequest.reviewThreads;

              // Alle ungelösten Threads sammeln
              const openThreads = threads.nodes.filter(t => !t.isResolved);
              unresolvedThreads.push(...openThreads);

              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            // 4. Sanitize-Funktion, um HTML-Kommentare, <details> und Badges zu entfernen
            function sanitizeComment(text) {
              if (!text) return "";
              // HTML-Kommentare bis zum Fixpunkt entfernen, sonst setzt ein
              // verschachtelter Kommentar (`<!-<!--x-->- ... -->`) den Marker wieder zusammen.
              let previous
              do {
                previous = text
                text = text.replace(/<!--[\s\S]*?-->/g, '')
              } while (text !== previous)
              return text
                // Entferne Devin-Badge HTML-Block (zusammenhängende a/picture/img Struktur)
                .replace(/<a[^>]*>\s*<picture[^>]*>[\s\S]*?<\/picture>\s*<\/a>/gi, '')
                // Entferne alle HTML-Kommentare
                .replace(/<!--[\s\S]*?-->/g, '')
                // Entferne <details> Blöcke inklusive Inhalt
                .replace(/<details[^>]*>[\s\S]*?<\/details>/gi, '')
                // Entferne Markdown Bilder/Badges: [![alt](url)](url) und ![alt](url)
                .replace(/\[!\[[^\]]*\]\([^)]+\)\]\([^)]+\)/g, '')
                .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
                // Entferne übrig gebliebene <picture> oder <img> Tags
                .replace(/<picture[^>]*>[\s\S]*?<\/picture>/gi, '')
                .replace(/<img[^>]*>/gi, '')
                // Entferne Feedback-Zeile von Bot-Kommentaren
                .replace(/---\s*\*Was this helpful\? React with 👍 or 👎 to provide feedback\.\*/g, '')
                // Maskiere Backticks, um Ausbrechen aus dem Markdown Code-Block zu verhindern
                .replace(/```/g, '\\`\\`\\`')
                // Zeilenumbrüche durch Leerzeichen ersetzen
                .replace(/\r?\n|\r/g, ' ')
                // Mehrfache Leerzeichen bereinigen
                .replace(/\s{2,}/g, ' ')
                .trim();
            }

            // 5. Den kopierbaren Block formatieren - NUR offene Review Threads
            const validThreads = [];
            const newThreads = [];
            const newThreadIds = new Set(reportedThreadIds);

            const formattedComments = unresolvedThreads.map(t => {
              const firstComment = t.comments.nodes[0];
              if (!firstComment) return null;

              const author = firstComment.author;
              const login = author ? author.login : "unknown";

              const cleanBody = sanitizeComment(firstComment.body);

              // Keine Deduplizierung über den Text: Jeder Thread wird über seine
              // GraphQL-ID verfolgt, auch wenn zwei Threads gleich beginnen.
              validThreads.push(t);
              newThreadIds.add(t.id); // Alle gültigen aktuellen Thread-IDs merken

              // Für core.setFailed nur die neuen Threads filtern, die wir noch nicht gemeldet hatten
              if (!reportedThreadIds.has(t.id)) {
                newThreads.push(`- [${login}]: ${cleanBody}`);
              }

              return `- [${login}]: ${cleanBody}`;
            }).filter(Boolean).join('\n');

            let copyableBlock = formattedComments.length > 0
              ? formattedComments
              : "Keine offenen Review-Threads vorhanden.";

            const header = `\n### 📝 PR Kommentar-Zusammenfassung\n*Wird automatisch aktualisiert, sobald sich Kommentare ändern.*\n\n\`\`\`text\n`;
            const footer = `\n\`\`\`\n`;

            // Die Thread-IDs als versteckten HTML-Kommentar abspeichern
            const idsStateMarker = `\n<!-- REPORTED_THREADS: ${Array.from(newThreadIds).join(',')} -->`;
            const MAX_COMMENT_SIZE = 65536;
            const extraText = "\n... (truncated)";
            // Keep the verdict in the bot-owned report, so PR-event reports can
            // refresh a later merge commit even when no head check was published.
            const priorVerdict = existingBotComment?.body.match(/\n<!-- TRACKER_VERDICT: (success|failure) -->$/)?.[1];
            const verdict = newThreads.length > 0 ? 'failure' : 'success';
            function renderReport(storedVerdict) {
              const verdictMarker = storedVerdict ? `\n<!-- TRACKER_VERDICT: ${storedVerdict} -->` : '';
              const fixedLength = marker.length + header.length + footer.length + idsStateMarker.length + verdictMarker.length;
              const allowedLength = MAX_COMMENT_SIZE - fixedLength - extraText.length;
              const text = fixedLength + copyableBlock.length > MAX_COMMENT_SIZE
                ? copyableBlock.substring(0, allowedLength) + extraText
                : copyableBlock;
              return marker + header + text + footer + idsStateMarker + verdictMarker;
            }

            const body = renderReport(verdict);
            const periodic = process.env.PERIODIC_REFRESH === 'true';
            // Keep the previous novelty verdict until the thread state changes.
            // A new test merge commit still needs that verdict, without overwriting
            // the head check or treating previously reported threads as new.
            if (periodic && existingBotComment?.body === renderReport(priorVerdict)) {
              const head = process.env.PR_HEAD_SHA;
              const merge = process.env.PR_MERGE_SHA;
              if (process.env.SAME_REPO_PR === 'true' && head && merge && merge !== head) {
                const checkName = 'Aggregate Comments & Enforce Resolution';
                const trackerChecks = async ref => (await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref, check_name: checkName, filter: 'all', per_page: 100
                })).filter(check => check.name === checkName && check.app?.slug === 'github-actions')
                  .sort((a, b) => b.id - a.id);
                const mergeChecks = await trackerChecks(merge);
                if (mergeChecks.length === 0) {
                  // Legacy reports lack a stored verdict; use an existing head
                  // check only when it belongs to this PR and has a completed conclusion.
                  const [headCheck] = priorVerdict ? [] : (await trackerChecks(head))
                    .filter(check => check.pull_requests?.some(pr => pr.number === prNumber));
                  const previousVerdict = priorVerdict ?? (
                    headCheck?.status === 'completed' && ['success', 'failure'].includes(headCheck.conclusion)
                      ? headCheck.conclusion : null
                  );
                  if (previousVerdict) {
                    await github.rest.checks.create({
                      owner, repo, name: checkName, head_sha: merge,
                      status: 'completed', conclusion: previousVerdict,
                      output: {
                        title: 'Review thread tracker refreshed',
                        summary: 'Previous review thread tracker verdict.'
                      }
                    });
                  } else {
                    core.warning('No stored or completed head tracker verdict; merge check will be retried.');
                  }
                }
              }
              return;
            }

            // Fork-PRs: Das Token ist schreibgeschützt, Kommentar und gemeldete Thread-IDs
            // können nicht gespeichert werden. Ohne Speicherung wäre jeder offene Thread bei
            // jedem Lauf "neu"; der Lauf ist daher nur informativ: kein Schreiben, kein Gate.
            if (process.env.SAME_REPO_PR !== 'true') {
              core.notice(`Fork-PR: Zusammenfassung und gemeldete Thread-IDs werden nicht gespeichert, daher keine Prüfung auf neue Threads. ${validThreads.length} offene Review-Thread(s) stehen im Log.`);
              console.log(copyableBlock);
              return;
            }

            // Scheduled workflows run on the default branch. Refresh both PR refs:
            // required checks can be evaluated on the test merge commit. Publish
            // before persisting the report, so a failed publication can be retried.
            if (periodic) {
              const shas = new Set([process.env.PR_HEAD_SHA, process.env.PR_MERGE_SHA].filter(Boolean));
              for (const head_sha of shas) {
                await github.rest.checks.create({
                  owner, repo,
                  name: 'Aggregate Comments & Enforce Resolution',
                  head_sha,
                  status: 'completed',
                  conclusion: newThreads.length > 0 ? 'failure' : 'success',
                  output: {
                    title: 'Review thread tracker refreshed',
                    summary: `${validThreads.length} open review thread(s); ${newThreads.length} newly reported.`
                  }
                });
              }
            }

            // 6. Prüfen, ob der Zusammenfassungs-Kommentar bereits existiert und updaten/erstellen
            try {
              if (existingBotComment) {
                console.log(`Aktualisiere bestehenden Kommentar (ID: ${existingBotComment.id})...`);
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingBotComment.id,
                  body: body
                });
              } else {
                console.log("Erstelle neuen Zusammenfassungs-Kommentar...");
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: body
                });
              }
            } catch (err) {
              core.warning(`Fehler beim Erstellen/Aktualisieren des Zusammenfassungs-Kommentars: ${err.message}`);
            }

            // 7. Workflow-Status auswerten - Bot blockiert nur anhand NEUER, noch nicht gemeldeter Review Threads
            if (newThreads.length > 0) {
              // Schreibe den formatierten Text der blockierenden NEUEN Review-Threads in core.setFailed
              const newThreadsBlock = newThreads.join('\n');
              core.setFailed(`Der Workflow blockiert den PR. Es existieren ${newThreads.length} NEUE ungelöste(r) Review-Thread(s):\n\n${newThreadsBlock}`);
            } else {
              console.log("Keine neuen blockierenden Review-Threads vorhanden. Workflow erfolgreich.");
            }
