name: Lint Fix Preview
run-name: Lint Fix Preview - PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POST_ON_DIFF_ONLY: 'true' # set to 'false' to post informational comments too
  JSCPD_MIN_LINES: '8'
  JSCPD_MIN_TOKENS: '60'
  JSCPD_IGNORE: '**/dist/**,**/.claude/**,**/.agents/**,**/report/**,**/*.test.js,**/*.spec.js,**/__tests__/**,**/tests/**,**/node_modules/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history required for diffs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run jscpd duplicate detection
        id: run-jscpd
        run: |
          if [[ -d "src/app" ]]; then TARGET="src/app"; elif [[ -d "src" ]]; then TARGET="src"; else TARGET="."; fi
          echo "Running jscpd on: $TARGET"
          # pnpm exec, not dlx: jscpd is pinned in devDependencies (5.0.12), so
          # this uses the locked version instead of resolving a fresh one from
          # the registry on every run.
          pnpm exec jscpd \
            --reporters json \
            --output ./jscpd-report \
            --min-lines "$JSCPD_MIN_LINES" \
            --min-tokens "$JSCPD_MIN_TOKENS" \
            --ignore "$JSCPD_IGNORE" \
            "$TARGET" || true
          if [[ -d jscpd-report ]]; then ls -la jscpd-report || true; head -n 200 jscpd-report/*.json || true; else echo "no jscpd-report directory created"; fi

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/lint-fix-preview.sh || true
          chmod +x scripts/analyze-duplicates.js || true

      - name: Run lint/format preview (produces comment.md and outputs)
        id: lint-preview
        # Expressions go through env, never into the script text: a branch
        # name is attacker-chosen data, not shell source.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ./scripts/lint-fix-preview.sh "$BASE_REF"

      - name: Debug lint-preview outputs
        env:
          HAS_DIFF: ${{ steps.lint-preview.outputs.has_diff }}
          HAS_DUP: ${{ steps.lint-preview.outputs.has_dup }}
          DUP_TOTAL: ${{ steps.lint-preview.outputs.dup_total }}
          SHOULD_COMMENT: ${{ steps.lint-preview.outputs.should_comment }}
        run: |
          echo "has_diff=$HAS_DIFF"
          echo "has_dup=$HAS_DUP"
          echo "dup_total=$DUP_TOTAL"
          echo "should_comment=$SHOULD_COMMENT"
          echo "POST_ON_DIFF_ONLY=$POST_ON_DIFF_ONLY"

      - name: Post lint preview comment to PR
        # Forks cannot be commented on with the read-only token they receive.
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          ((env.POST_ON_DIFF_ONLY == 'true' && (steps.lint-preview.outputs.has_diff == '1' || steps.lint-preview.outputs.has_dup == '1')) ||
          (env.POST_ON_DIFF_ONLY != 'true' && steps.lint-preview.outputs.should_comment == '1'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lint-fix-preview: do-not-edit -->';
            const body = fs.readFileSync('comment.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            // Paginate: the sticky report can sit past the first 30 comments.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            // Only the bot's own comment: a planted marker must not be reused.
            const existing = comments.find(
              c => c.user?.login === 'github-actions[bot]' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
