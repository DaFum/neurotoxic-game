name: Setup Node and pnpm
description: Install pnpm, configure Node.js caching, and install dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22.13.0'
  install-args:
    description: Arguments passed to pnpm install.
    required: false
    default: '--frozen-lockfile --ignore-scripts'

runs:
  using: composite
  steps:
    - name: Determine pnpm version
      id: pnpm-version
      shell: bash
      run: |
        version="$(node -p "require('./package.json').packageManager.split(/[+@]/)[1]")"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Validate pnpm version
      shell: bash
      run: |
        expected="$(node -p "require('./package.json').packageManager.split(/[+@]/)[1]")"
        actual="$(pnpm --version)"
        test "$actual" = "$expected" || {
          echo "Expected pnpm $expected from package.json, got $actual" >&2
          exit 1
        }

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
